# Netlify: build e publicação do site REZZU (ver ARQUITETURA.md §11)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 exige Node >= 22.12
  NODE_VERSION = "22"

# Arquivos com hash gerados pelo Astro: cache de 1 ano
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeçalhos de segurança em todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Quando houver domínio próprio, descomentar e ajustar (www -> raiz):
